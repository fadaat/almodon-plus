<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="plus-data.js"></script>
<style>body{margin:0;font-family:'IBM Plex Sans Arabic',sans-serif;color:#121417}a{color:#0A2B5C;text-decoration:none}a:hover{color:#3F97CF}*{box-sizing:border-box}</style>
</helmet>
<dc-import name="ProtoNav" opt="b" screen="S" hide="{{ embedded }}" hint-size="100%,56px"></dc-import>
<div dir="rtl" style="display:flex;justify-content:center;gap:48px;align-items:flex-start">
  <div data-screen-label="Shorts B Mobile" style="width:390px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 20px 50px rgba(10,43,92,.15);flex:none">
    <dc-import name="NewsBlocks" part="header" mobile="{{ true }}" hint-size="100%,70px"></dc-import>
    <div style="display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid #E4E7EC"><span style="padding:8px 10px;font:700 13px 'Noto Kufi Arabic';color:#5E6673">البرامج</span><span style="padding:8px 10px;font:700 13px 'Noto Kufi Arabic';color:#0A2B5C;border-bottom:3px solid #F7C600">شورتس</span></div>
    
    <div style="padding:0 16px 12px;display:flex;gap:6px;overflow:hidden"><sc-for list="{{ chips }}" as="c" hint-placeholder-count="5"><div onClick="{{ c.on }}" style="flex:none;white-space:nowrap;padding:7px 12px;border-radius:999px;font:600 12px 'Noto Kufi Arabic';cursor:pointer;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.bd }}">{{ c.label }}</div></sc-for></div>
    <div style="padding:0 16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><sc-for list="{{ grid }}" as="s" hint-placeholder-count="6"><div style="position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden"><img src="{{ s.img }}" alt="" style="width:100%;height:100%;object-fit:cover"><span style="position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;font:500 10px sans-serif;padding:1px 5px;border-radius:3px">{{ s.dur }}</span><div style="position:absolute;inset:auto 0 0 0;padding:30px 8px 8px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);display:flex;flex-direction:column;gap:2px"><span style="font:600 12px/1.5 'IBM Plex Sans Arabic';color:#fff">{{ s.title }}<br><span style="font-size:10px;font-weight:500;opacity:.85">{{ s.meta }}</span></span><span style="font-size:10px;color:#D5DCE6">▶ {{ s.views }}</span></div></div></sc-for></div>
  <dc-import name="Footer" mobile="{{ true }}" brand="{{ brand }}" hint-size="100%,520px"></dc-import></div>

  <div data-screen-label="Shorts B Desktop" style="width:1440px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(10,43,92,.15);flex:none">
    <dc-import name="NewsBlocks" part="header" mobile="{{ false }}" hint-size="100%,170px"></dc-import>
    <div style="padding:28px 120px 0;display:flex;align-items:flex-end;justify-content:space-between"><div style="display:flex;gap:8px;align-items:baseline"><span style="font:700 18px 'Noto Kufi Arabic';color:#5E6673">{{ brand }} ‹</span><h1 style="margin:0;font:800 34px 'Noto Kufi Arabic';color:#0A2B5C">شورتس</h1></div><div style="display:flex;gap:8px"><sc-for list="{{ chips }}" as="c" hint-placeholder-count="5"><div onClick="{{ c.on }}" style="flex:none;white-space:nowrap;padding:8px 16px;border-radius:999px;font:600 13px 'Noto Kufi Arabic';cursor:pointer;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.bd }}">{{ c.label }}</div></sc-for></div></div>
    
    <div style="padding:28px 120px 40px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px"><sc-for list="{{ gridL }}" as="s" hint-placeholder-count="12"><div style="display:flex;flex-direction:column;gap:8px"><div style="position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden"><img src="{{ s.img }}" alt="" style="width:100%;height:100%;object-fit:cover"><span style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font:500 11px sans-serif;padding:1px 6px;border-radius:3px">{{ s.dur }}</span><span style="position:absolute;bottom:8px;right:8px;color:#fff;font:600 11px 'IBM Plex Sans Arabic';text-shadow:0 1px 3px #000">▶ {{ s.views }}</span></div><span style="font:600 14px/1.5 'IBM Plex Sans Arabic'">{{ s.title }}<br><span style="font-size:10px;font-weight:500;opacity:.85">{{ s.meta }}</span></span></div></sc-for></div>
  <dc-import name="Footer" mobile="{{ false }}" brand="{{ brand }}" hint-size="100%,300px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { c: 'الأحدث' };
  renderVals() { return Object.assign({ brand: this.props.brand ?? 'برامج المدن' }, this._rv()); }
  _rv() {
    const D = window.PLUS_DATA || { shorts: [], nav: [] };
    const S = D.shorts;
    const chips = ['الأحدث', 'الأكثر مشاهدة', 'سياسة', 'تاريخ', 'ثقافة'].map(k => { const a = this.state.c === k; return { label: k, on: () => this.setState({ c: k }), bg: a ? '#0A2B5C' : '#fff', fg: a ? '#fff' : '#0A2B5C', bd: a ? '#0A2B5C' : '#D5DAE1' }; });
    const order = this.state.c === 'الأكثر مشاهدة' ? [4, 2, 5, 0, 1, 3, 7, 6] : this.state.c === 'الأحدث' ? [0, 1, 2, 3, 4, 5, 6, 7] : [3, 0, 6, 2, 7, 1, 5, 4];
    const grid = order.map(i => S[i]).filter(Boolean);
    return { nav: D.nav, chips, grid, gridL: grid.concat(grid.slice(0, 4)), cw: [5, 2, 7, 1].map((i, k) => ({ ...S[i], pct: [40, 75, 20, 60][k] + '%' })).filter(s => s.img) };
  }
}
</script>
</body>
</html>
