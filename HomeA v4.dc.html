    const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    const cw = D.episodes.map((e, i) => ({ ...e, p: e.p || [0.45, 0.7, 0.2, 0.55][i % 4] }))
      .filter(e => e.kind === 'حلقة كاملة')
      .map(e => ({ ...e, pct: Math.round(e.p * 100) + '%', left: fmt(Math.round(toSec(e.dur) * (1 - e.p))) }));
    return {
      nav: D.nav, navShort: D.nav.slice(0, 5),
      featured: D.episodes[0] || {}, eps3: D.episodes.slice(1, 4), e2: D.episodes[1] || {},
      shorts: D.shorts, shorts4: D.shorts.slice(0, 4), shorts6: D.shorts.slice(0, 6),
      shows: D.shows, shows5: D.shows.slice(0, 5), cw, cw4: cw.slice(0, 4),
      today: [{ time: '18:00', name: 'نشرة المدن', note: 'يومياً' }, { time: '20:00', name: 'وجهًا لوجه', note: 'حلقة جديدة' }, { time: '21:30', name: 'شو رأيك؟', note: 'إعادة' }]
    };
  }
}
</script>
