<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>@keyframes epsdot{0%{box-shadow:0 0 0 0 rgba(217,45,32,.5)}70%{box-shadow:0 0 0 6px rgba(217,45,32,0)}100%{box-shadow:0 0 0 0 rgba(217,45,32,0)}}</style>
</helmet>
<div dir="rtl" style="display:flex;align-items:center;gap:12px;padding:{{ pad }};background:#F5F6F8;border-top:1px solid #E4E7EC;border-bottom:1px solid #E4E7EC">
  <span style="flex:none;font:800 13px 'Noto Kufi Arabic';color:#0A2B5C">جدول اليوم</span>
  <span style="flex:none;width:1px;height:18px;background:#D5DAE1"></span>
  <div style="flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;white-space:nowrap">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="6"><div style="flex:none;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:{{ i.bg }};opacity:{{ i.op }}"><sc-if value="{{ i.live }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;border-radius:50%;background:#D92D20;animation:epsdot 1.6s infinite"></span></sc-if><span style="font:700 12px sans-serif;color:{{ i.tc }}">{{ i.time }}</span><span style="font:700 12px 'Noto Kufi Arabic';color:#121417">{{ i.show }}</span><span style="font:500 11px 'IBM Plex Sans Arabic';color:#5E6673">{{ i.note }}</span></div></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;60px&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const NOW = 16 * 60 + 20;
    const raw = [[13 * 60, 50, 'وثائقيات', 'إعادة'], [16 * 60, 50, 'وثائقيات', 'إعادة'], [18 * 60, 15, 'نشرة المدن', ''], [22 * 60, 50, 'وثائقيات', 'حلقة جديدة'], [12 * 60, 30, 'من الأرشيف', '']].sort((a, b) => a[0] - b[0]);
    const f = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    const items = raw.filter(([s, d]) => s + d > NOW).map(([s, d, show, note]) => { const past = s + d <= NOW, live = s <= NOW && !past; return { time: live ? 'الآن' : f(s), show, note, live, bg: live ? '#FFF3C2' : '#fff', tc: live ? '#D92D20' : '#0A2B5C', op: past ? 0.5 : 1 }; });
    return { items, pad: this.props.mobile ? '10px 16px' : '12px 120px' };
  }
}
</script>
</body>
</html>
